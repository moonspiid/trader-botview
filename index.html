<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trader BotView — Grille Futures Binance</title>
<meta name="description" content="Trader BotView — paramètres de bot de grille Futures Binance calculés en direct : bornes, nombre de grilles, marge, levier, TP et SL, chacun copiable en un appui.">
<meta name="theme-color" content="#06080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trader BotView">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<style>
:root{
  --bg:#06080c;--panel:#0b1018;--panel2:#0e1521;--line:#1b2534;--line2:#2a3a4f;
  --txt:#e9eff8;--muted:#8b9cb4;--dim:#5c6b81;
  --acc:#f0b90b;--up:#3ddc97;--dn:#ff6b81;--cy:#57e6c8;--vi:#a78bfa;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 70% at 85% -10%,#111d2e 0%,#06080c 58%) fixed,#06080c;
  color:var(--txt);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
body{display:flex;align-items:center;justify-content:center}
.app{
  height:100dvh;max-height:min(100dvh,880px);width:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:6px;
  padding:calc(7px + env(safe-area-inset-top)) 10px calc(7px + env(safe-area-inset-bottom));
}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.brand img{width:26px;height:26px;border-radius:7px;flex:0 0 auto}
.brand .bt{font-size:13px;font-weight:800;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bs{display:block;font-size:8px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;margin-top:1px}
.tools{display:flex;align-items:center;gap:5px;flex:0 0 auto}
#lang{
  appearance:none;-webkit-appearance:none;background:var(--panel2);border:1px solid var(--line2);
  border-radius:8px;padding:6px 22px 6px 8px;font-size:11px;font-weight:800;letter-spacing:.04em;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line2);font-size:14px;position:relative;
}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:15px;height:15px;flex:0 0 auto}
.icon-btn.lang{width:auto;min-width:48px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.05em}
.icon-btn.lang svg{width:12px;height:12px;opacity:.7;flex:0 0 auto}
.modebar{display:flex;align-items:center;gap:6px}
.mode{
  flex:1;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;
}
.mode.active{background:linear-gradient(180deg,#1d2839,#131b27);border-color:#3a4c66;color:var(--txt)}
.mode.active::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
.status{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim);font-family:var(--mono);white-space:nowrap;max-width:96px;overflow:hidden}
.status i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.status.ok i{background:var(--up);box-shadow:0 0 6px rgba(61,220,151,.6)}
.status.busy i{background:var(--acc);animation:pulse 1s infinite}
.status.err i{background:var(--dn)}
.status.spot i{background:var(--acc)}
@keyframes pulse{50%{opacity:.25}}
.controls{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:1fr auto;gap:6px}
.crow.two{grid-template-columns:auto 1fr 1fr}
#pair{
  width:100%;height:38px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  padding:0 11px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
#pair::placeholder{color:#3f4d63;text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:500}
#pair:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(240,185,11,.15)}
#pair[readonly]{color:var(--acc);border-color:#4a3c10;background:#120f06}
.go{
  height:38px;padding:0 16px;border-radius:10px;background:linear-gradient(180deg,#f5c322,#e0a800);
  color:#1a1300;font-size:12px;font-weight:800;letter-spacing:.02em;white-space:nowrap;
}
.go:active{transform:scale(.97)}
.go[disabled]{opacity:.55}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 9px;border-radius:7px;font-size:10.5px;font-weight:700;color:var(--dim)}
.seg button.active{background:#1d2839;color:var(--txt)}
.mini{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini span{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);padding-left:2px}
.mini input{
  width:100%;height:30px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
  padding:0 8px;font-family:var(--mono);font-size:12px;font-weight:700;text-align:right;
}
.mini input:focus{outline:none;border-color:var(--acc)}
.top,.modebar,.controls,.kpis,.note{flex:0 0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-width:0;overflow:hidden}
.kpi span{display:block;line-height:1.15;font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;line-height:1.2;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cells{flex:1 1 auto;min-height:0;max-height:min(64dvh,540px);margin:auto 0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:6px}
.cell{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:3px;
  background:linear-gradient(180deg,#0f1724,#0a0f18);border:1px solid var(--line);border-radius:10px;
  padding:6px 7px;min-height:0;overflow:hidden;text-align:left;transition:border-color .15s,background .15s;
}
.cell:active{border-color:#3d5170}
.cell .k{font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .k i{font-style:normal;font-weight:600;color:#3b4b64;letter-spacing:.05em}
.cell .v{
  font-family:var(--mono);font-size:clamp(12px,4vw,17px);font-weight:700;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cell .cp{
  display:flex;align-items:center;justify-content:center;gap:4px;height:24px;border-radius:6px;
  border:1px solid #2b3b52;background:#141d2b;color:var(--muted);font-size:9.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;
}
.cell .cp svg{width:10px;height:10px}
.cell.copied{background:linear-gradient(180deg,#0d2a1c,#0a1d14);border-color:#2c7a4e}
.cell.copied .v{color:var(--up)}
.cell.copied .cp{background:#123d27;border-color:#2f7a4c;color:#8bf5b4}
.cell-edit{padding:5px 6px;gap:2px}
.cell-edit .krow{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.cell-edit .krow .k{flex:1 1 auto}
.autoTag{font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:#3f4d63;flex:0 0 auto}
.autoBtn{font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border:1px solid #4a3c10;background:#16120a;border-radius:4px;padding:1px 4px;flex:0 0 auto}
.stepRow{display:flex;align-items:center;gap:3px;min-width:0}
.stepRow .step{width:22px;height:26px;border-radius:6px;border:1px solid #2b3b52;background:#141d2b;color:var(--txt);font-size:15px;font-weight:700;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.stepRow .step:active{background:#1f2c3f}
.stepRow input{flex:1 1 auto;min-width:0;width:100%;height:26px;background:#0a111b;border:1px solid #2b3b52;border-radius:6px;text-align:center;font-family:var(--mono);font-size:clamp(13px,4vw,16px);font-weight:700;color:var(--txt);padding:0 2px}
.stepRow input:focus{outline:none;border-color:var(--acc);background:#0d1622}
.note{
  margin-top:auto;font-size:9.5px;line-height:1.35;color:var(--muted);text-align:center;min-height:24px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.note b{color:var(--txt);font-weight:700}
.note .warn{color:var(--acc)}
.note .bad{color:var(--dn)}
.cred{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  font:9px/1 var(--mono);color:var(--dim);padding:1px 0 4px;letter-spacing:.02em;
}
.cred a,.cred button{
  color:var(--muted);text-decoration:none;background:none;border:0;font:inherit;
  padding:3px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;
}
.cred a:hover,.cred button:hover{color:var(--acc)}
.cred .sep{color:var(--line2)}
.donAddr{
  width:100%;display:block;text-align:left;background:var(--panel2);border:1px solid var(--line2);
  border-radius:9px;padding:9px 10px;margin:0 0 9px;color:var(--txt);
  font:10.5px/1.5 var(--mono);word-break:break-all;cursor:pointer;
}
.donAddr:active{border-color:var(--acc)}
.donAddr small{display:block;color:var(--dim);font-size:8.5px;margin-top:3px;font-family:var(--sans)}
.donP{font-size:10.5px;line-height:1.55;color:var(--muted);margin:0 0 10px}
.donQr{display:block;margin:0 auto 10px;width:132px;height:132px;border-radius:8px;background:#fff;padding:5px}
.icon-btn.spin svg{animation:spin .8s linear}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(3,5,9,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .box{width:100%;max-width:460px;background:#0c1119;border:1px solid var(--line2);border-radius:14px 14px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{font-size:13px;margin:0 0 9px}
.sheet ol{margin:0 0 10px;padding-left:17px;font-size:11px;line-height:1.6;color:var(--muted);display:grid;gap:5px}
.sheet ol b{color:var(--txt)}
.sheet .go{width:100%}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#101a27;border:1px solid var(--line2);color:var(--txt);font-size:11px;font-weight:600;
  padding:8px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:720px){
  .app{gap:4px;padding:7px 8px}
  .cell{padding:4px 5px;gap:2px}
  .cell-edit{padding:4px 5px}
  .cell .v{font-size:clamp(12px,3.8vw,15px)}
  .cell .cp{height:21px;font-size:9px}
  .stepRow .step{width:20px;height:22px;font-size:13px}
  .stepRow input{height:22px}
  .kpi{padding:3px 5px}
}
@media (max-height:620px){
  .app{gap:3px;padding:6px}
  .note{font-size:8.5px;line-height:1.15}
  .cell .cp{height:17px;font-size:8px}
  .cell .v{font-size:clamp(11px,3.4vw,14px)}
  .cell .k{font-size:7.5px}
  .kpi b{font-size:10px}
  .cell{padding:3px 5px}
  .cell-edit{padding:2px 4px;gap:1px}
  .stepRow .step{width:17px;height:18px;font-size:11px}
  .stepRow input{height:18px;font-size:12px}
}
@media (max-width:340px){
  .brand .bs{display:none}
  .cell .v{font-size:11px}
}
</style>
</head>
<body>

    <button type="button" id="btnDon" data-i18n="credDon">Don USDT</button>

</div>


<div class="sheet" id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <h3 data-i18n="installTitle">Installer BotView</h3>
    <ol id="installSteps"></ol>
    <button class="go" id="installClose" type="button" data-i18n="ok">Compris</button>
  </div>
</div>
<div class="sheet" id="donSheet" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <h3 data-i18n="donTitle">Soutenir le projet</h3>

</div>
<div class="toast" id="toast"></div>

/* ============================== indicators ============================== */
function ema(vals, p) {
  const out = new Array(vals.length).fill(null);
  if (vals.length < p) return out;
  const k = 2 / (p + 1);
  let prev = 0;
  for (let i = 0; i < p; i++) prev += vals[i];
  prev /= p;
  out[p - 1] = prev;
  for (let i = p; i < vals.length; i++) { prev = vals[i] * k + prev * (1 - k); out[i] = prev; }
  return out;
}
function rsiCalc(vals, p = 14) {
  const out = new Array(vals.length).fill(null);
  if (vals.length <= p) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = vals[i] - vals[i - 1]; if (d >= 0) g += d; else l -= d; }
  g /= p; l /= p;
  out[p] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = p + 1; i < vals.length; i++) {
    const d = vals[i] - vals[i - 1], up = d > 0 ? d : 0, dn = d < 0 ? -d : 0;
    g = (g * (p - 1) + up) / p;
    l = (l * (p - 1) + dn) / p;
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function macdCalc(vals, f = 12, s = 26, sig = 9) {
  const ef = ema(vals, f), es = ema(vals, s);
  const line = vals.map((_, i) => (ef[i] != null && es[i] != null) ? ef[i] - es[i] : null);
  const compact = line.filter(v => v != null);
  const sigC = ema(compact, sig);
  const off = line.findIndex(v => v != null);
  const signal = new Array(vals.length).fill(null);
  if (off >= 0) sigC.forEach((v, i) => { if (v != null) signal[off + i] = v; });
  const hist = line.map((v, i) => (v != null && signal[i] != null) ? v - signal[i] : null);
  return { line: line, signal: signal, hist: hist };
}
function atrCalc(h, l, c, p = 14) {
  const n = c.length, out = new Array(n).fill(null);
  if (n <= p) return out;
  const tr = [];
  for (let i = 1; i < n; i++) tr.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  let a = tr.slice(0, p).reduce((x, y) => x + y, 0) / p;
  out[p] = a;
  for (let i = p + 1; i < n; i++) { a = (a * (p - 1) + tr[i - 1]) / p; out[i] = a; }
  return out;
}
function bollinger(vals, p = 20, k = 2) {
  const width = new Array(vals.length).fill(null);
  for (let i = p - 1; i < vals.length; i++) {
    const win = vals.slice(i - p + 1, i + 1);
    const m = win.reduce((a, b) => a + b, 0) / p;
    const sd = Math.sqrt(win.reduce((a, b) => a + (b - m) * (b - m), 0) / p);
    width[i] = m ? (((m + k * sd) - (m - k * sd)) / m) * 100 : null;
  }
  return width;
}
function adxCalc(h, l, c, p = 14) {
  const n = c.length;
  const res = { adx: new Array(n).fill(null) };
  if (n < 2 * p + 1) return res;
  const tr = [], pdm = [], ndm = [];
  for (let i = 1; i < n; i++) {
    const up = h[i] - h[i - 1], dn = l[i - 1] - l[i];
    pdm.push(up > dn && up > 0 ? up : 0);
    ndm.push(dn > up && dn > 0 ? dn : 0);
    tr.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  }
  let trS = 0, pS = 0, nS = 0;
  for (let i = 0; i < p; i++) { trS += tr[i]; pS += pdm[i]; nS += ndm[i]; }
  const dx = [];
  const push = () => {
    const pdi = trS ? 100 * pS / trS : 0, ndi = trS ? 100 * nS / trS : 0;
    const s = pdi + ndi;
    dx.push(s ? 100 * Math.abs(pdi - ndi) / s : 0);
  };
  push();
  for (let k = p; k < tr.length; k++) {
    trS = trS - trS / p + tr[k];
    pS = pS - pS / p + pdm[k];
    nS = nS - nS / p + ndm[k];
    push();
  }
  if (dx.length < p) return res;
  let a = dx.slice(0, p).reduce((x, y) => x + y, 0) / p;
  res.adx[2 * p - 1] = a;
  for (let i = p; i < dx.length; i++) { a = (a * (p - 1) + dx[i]) / p; res.adx[p + i] = a; }
  return res;
}

function metrics(symbol, candles, t24, filters) {
  const close = candles.map(x => x.c);
  const high = candles.map(x => x.h);
  const low = candles.map(x => x.l);
  const price = +t24.lastPrice || close[close.length - 1];
  const atr = lastVal(atrCalc(high, low, close, 14));
  const adx = lastVal(adxCalc(high, low, close, 14).adx);
  const e20 = lastVal(ema(close, 20)), e50 = lastVal(ema(close, 50));
  const rsiV = lastVal(rsiCalc(close, 14));
  const hist = lastVal(macdCalc(close).hist);
  const bw = lastVal(bollinger(close, 20, 2));
  const bias = clamp(((e20 - e50) / price) * 900 + (hist / price) * 5000 + (rsiV - 50) * 0.5, -100, 100);
  return {
    symbol: symbol, price: price, filters: filters || {},
    atrPct: atr ? atr / price * 100 : 0, adx: adx, bbW: bw, bias: bias,
    qv: +t24.quoteVolume || 0, chg: +t24.priceChangePercent || 0, funding: null
  };
}

function scoreForGrid(m) {
  let s = 0;
  s += m.adx == null ? 12 : m.adx < 18 ? 34 : m.adx < 24 ? 25 : m.adx < 30 ? 12 : 0;
  s += m.atrPct >= 1 && m.atrPct <= 4 ? 26 : m.atrPct >= 0.6 && m.atrPct < 6 ? 16 : 4;
  s += clamp(Math.log10(Math.max(1, m.qv / 1e6)) * 12, 0, 22);
  s += m.bbW && m.bbW > 2 ? 8 : 2;
  s -= Math.abs(m.chg) > 12 ? 10 : 0;
  return Math.round(clamp(s, 0, 100));
}

const MIN_GRIDS = 2, MAX_GRIDS = 150, AUTO_MAX = 60;
const FEE_RATE = 0.0005, MAX_AUTO_LEV = 10, MIN_BUF = 1.001;
const LOOKBACK = { '15m': 96, '1h': 72, '4h': 42, '1d': 30 };

function buildGrid(m, capital, lev, override) {
  const f = m.filters || {};
  const tick = f.tick || '0.01', step = f.step || '0.00001';
  const minN = f.minN || 5, minQ = f.minQ || 0;
  const reqLev = clamp(Math.round(lev) || 1, 1, 10);
  const total = Math.max(Number(capital) || 0, 0);
  const minPerGrid = Math.max(minN, (minQ || 0) * m.price);
  const floorNotional = MIN_GRIDS * minPerGrid * MIN_BUF;

  let L = reqLev, reserve = total * L * FEE_RATE, invested = Math.max(total - reserve, 0);
  if (invested > 0 && invested * L < floorNotional) {
    const lMin = Math.ceil(floorNotional / (invested * (1 - MAX_AUTO_LEV * FEE_RATE)));
    if (lMin > reqLev && lMin <= MAX_AUTO_LEV) L = lMin;
  }
  reserve = total * L * FEE_RATE;
  invested = Math.max(total - reserve, 0);
  const needLev = Math.max(reqLev, MAX_AUTO_LEV);
  const need = Math.ceil(floorNotional / (needLev * (1 - needLev * FEE_RATE)));
  const notional = invested * L;
  const maxByCapital = Math.floor(notional / (minPerGrid * MIN_BUF));
  if (maxByCapital < MIN_GRIDS) return { error: 'funds', count: MIN_GRIDS, need: need, lev: needLev, minPerGrid: minPerGrid };

  const stepTarget = clamp(m.atrPct * 0.55, 0.5, 2.6);
  const guard = clamp(m.atrPct * 1.2, 2, 6);
  let rLo = m.price * (1 - guard / 100), rHi = m.price * (1 + guard / 100);
  if (m.lo > 0 && m.hi > m.lo) { rLo = Math.min(rLo, m.lo); rHi = Math.max(rHi, m.hi); }
  const widthRaw = (rHi - rLo) / m.price * 100;
  const manual = Number.isFinite(override) && override >= MIN_GRIDS;
  const wanted = manual ? Math.round(override) : Math.round(widthRaw / stepTarget);
  const cap = Math.min(manual ? MAX_GRIDS : AUTO_MAX, maxByCapital);
  const count = clamp(Math.min(wanted, cap), MIN_GRIDS, MAX_GRIDS);
  const capped = wanted > cap;
  const levRaised = L > reqLev;
  const wMin = clamp(count * stepTarget * 0.6, 4, 30), wMax = clamp(count * stepTarget * 1.8, 6, 30);
  let lower, upper;
  if (widthRaw >= wMin && widthRaw <= wMax) {
    lower = rLo; upper = rHi;
  } else {
    const w = clamp(widthRaw, wMin, wMax);
    lower = m.price * (1 - w / 200); upper = m.price * (1 + w / 200);
  }
  const widthEff = (upper - lower) / m.price * 100;
  const perNotional = notional / count;
  if (perNotional < minPerGrid) return { error: 'funds', count: count, need: need, lev: L, minPerGrid: minPerGrid };
  let qty = roundStep(perNotional / m.price, step, 'floor');
  if (qty < minQ) qty = roundStep(minQ, step, 'round');
  if (!qty || qty * m.price < minN) return { error: 'funds', count: count, need: need, lev: L, minPerGrid: minPerGrid };
  const geo = widthEff >= 12 || m.price >= 5000;
  const slRaw = lower * (1 - clamp(m.atrPct * 0.9 / 100, 0.012, 0.06));
  const stepPct = widthEff / count;
  const perGrid = invested / count;
  const plan = {
    symbol: m.symbol, lev: L, levRaised: levRaised, marginMode: 'ISOLATED',
    dec: clamp(decimalsOf(tick), 0, 8),
    lower: roundStep(lower, tick, 'round'),
    upper: roundStep(upper, tick, 'round'),
    count: count, geo: geo, width: widthEff, stepPct: stepPct, manual: manual,
    capped: capped, cap: cap,
    warn: perNotional < minN ? 'minNotional' : null, minN: minN, minPerGrid: minPerGrid,
    perGrid: perGrid, total: invested, capital: total, reserve: reserve,
    notional: notional, qty: qty,
    tp: roundStep(upper, tick, 'round'),
    sl: roundStep(slRaw, tick, 'round'),
    netPerGrid: stepPct - 0.04
  };
  return validatePlan(plan, m, total, minPerGrid, step, minN, minQ, need);
}

function validatePlan(p, m, capital, minPerGrid, step, minN, minQ, need) {
  const stepN = Number(step) || 0;
  const fails = [];
  if (!(p.count >= MIN_GRIDS)) fails.push('count');
  if (!(p.lev >= 1 && p.lev <= 10)) fails.push('lev');
  if (!(p.qty > 0)) fails.push('qty');
  if (minQ && p.qty < minQ - 1e-12) fails.push('minQty');
  if (p.qty * m.price < minN - 1e-9) fails.push('minNotional');
  if (p.qty * m.price < minPerGrid - 1e-9) fails.push('minPerGrid');
  if (stepN > 0 && Math.abs(p.qty / stepN - Math.round(p.qty / stepN)) > 1e-9) fails.push('step');
  if (!(p.lower < m.price && m.price < p.upper)) fails.push('range');
  if (p.perGrid * p.count > capital + 1e-6) fails.push('margin');
  if (p.total + p.reserve > capital + 1e-6) fails.push('reserve');
  if (fails.length) return { error: 'funds', count: p.count, need: need, lev: p.lev, minPerGrid: minPerGrid, fails: fails };
  p.valid = true;
  return p;
}

    '<div class="stepRow">' +
      '<button class="step" type="button" data-step="-1" aria-label="-1">−</button>' +
      '<input id="grids" type="text" inputmode="numeric" autocomplete="off" aria-label="' + esc(t('cGrids')) + '" value="' + p.count + '">' +
      '<button class="step" type="button" data-step="1" aria-label="+1">+</button>' +
    '</div>' +
    '<button class="cp copybtn" type="button" data-copy="' + p.count + '">' + COPY_ICON + '<span class="cpt">' + esc(t('copy')) + '</span></button>' +
    '</div>';
}

function errText(p) {
  if (!p) return '';
  return p.error === 'funds'
    ? t('errFunds', { n: nf(p.need || 0, 0), lev: p.lev || 1 })
    : t('errSmall', { n: p.count || MIN_GRIDS });
}

function paintError(p) {
  const cells = $$('#cfg .cell');
  cells.forEach(c => { const v = c.querySelector('.v'); if (v) v.textContent = '—'; });
  const cp = cells[5] && cells[5].querySelector('[data-copy]');
  if (cp) cp.setAttribute('data-copy', '');
  $('#note').innerHTML = '<span class="bad">' + esc(errText(p)) + '</span>';
}

function updateValues() {
  const m = state.metrics, p = state.plan;
  if (!m || !p) return;
  if (p.error) { paintError(p); return; }
  const gi = $('#grids');
  if (gi && document.activeElement !== gi && gi.value !== String(p.count)) gi.value = p.count;
  const rows = rowsFor(p);
  const cells = $$('#cfg .cell');
  rows.forEach((r, i) => {
    const cell = cells[i];
    if (!cell) return;
    const v = cell.querySelector('.v');
    if (v) v.textContent = r[1];
    const cp = cell.querySelector('[data-copy]');
    if (cp) cp.setAttribute('data-copy', String(r[2]));
  });
  const head = cells[5] && cells[5].querySelector('.krow');
  if (head && !!head.querySelector('[data-auto]') !== !!p.manual) {
    head.innerHTML = '<span class="k">' + label('cGrids') + '</span>' +
      (p.manual ? '<button class="autoBtn" type="button" data-auto="1">' + esc(t('auto')) + '</button>'
                : '<span class="autoTag">' + esc(t('auto')) + '</span>');
  }
  $('#note').innerHTML = noteHtml(p);
}

/* ============================== analysis ============================== */
function normalizePair(v) {
  const s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!s) return '';
  if (/USDT$/.test(s)) return s;
  if (/^[A-Z0-9]{2,10}$/.test(s)) return s + 'USDT';
  return '';
}

async function analysePair(symbol) {
  const ex = await loadExchange();
  const filters = ex.map.get(symbol);
  if (!filters) throw new Error('unknown');
  const t24 = await getJSON(API + '/api/v3/ticker/24hr?symbol=' + symbol);
  const candles = await klines(symbol, state.tf, 300);
  const m = metrics(symbol, candles, t24, filters);
  const n = LOOKBACK[state.tf] || 42;
  const win = candles.slice(-n);
  let hi = -Infinity, lo = Infinity;
  for (let i = 0; i < win.length; i++) {
    if (win[i].h > hi) hi = win[i].h;
    if (win[i].l < lo) lo = win[i].l;
  }
  m.hi = hi; m.lo = lo; m.lookback = n; m.tf = state.tf;
  m.funding = await fundingRate(symbol);
  return m;
}

async function runManual() {
  if (state.busy) return;
  const symbol = normalizePair($('#pair').value);
  if (!symbol) { toast(t('errPair')); return; }
  $('#pair').value = symbol;
  state.busy = true;
  $('#go').disabled = true;
  setStatus('busy', t('loading'));
  try {
    const m = await analysePair(symbol);
    state.metrics = m;
    state.plan = buildGrid(m, state.capital, state.lev, state.countOverride);
    render();
    setStatus(exchange && exchange.futures ? 'ok' : 'spot', symbol);
  } catch (e) {
    setStatus('err', e.message === 'unknown' ? t('errPair') : t('errNet'));
    toast(e.message === 'unknown' ? t('errPair') : t('errNet'));
  } finally {
    state.busy = false;
    $('#go').disabled = false;
  }
}

async function runAuto() {
  if (state.busy) return;
  state.busy = true;
  $('#go').disabled = true;
  setStatus('busy', t('scanning'));
  try {
    const ex = await loadExchange();
    const all = await getJSON(API + '/api/v3/ticker/24hr', 15000);
    const cands = all
      .filter(x => /USDT$/.test(x.symbol) && !/(UP|DOWN|BULL|BEAR)USDT$/.test(x.symbol))
      .filter(x => +x.quoteVolume > 15e6 && +x.lastPrice > 0)
      .sort((a, b) => +b.quoteVolume - +a.quoteVolume)
      .slice(0, 14);
    let best = null;
    for (let i = 0; i < cands.length; i++) {
      setStatus('busy', t('scanning') + ' ' + (i + 1) + '/' + cands.length);
      try {
        const c = await klines(cands[i].symbol, state.tf, 250);
        const m = metrics(cands[i].symbol, c, cands[i], ex.map.get(cands[i].symbol));
        const sc = scoreForGrid(m);
        if (!best || sc > best.sc) best = { m: m, sc: sc };
      } catch (e) { /* paire ignoree */ }
    }
    if (!best) throw new Error('none');
    best.m.funding = await fundingRate(best.m.symbol);
    state.metrics = best.m;
    state.plan = buildGrid(best.m, state.capital, state.lev, state.countOverride);
    $('#pair').value = best.m.symbol;
    render();
    setStatus('ok', best.m.symbol);
  } catch (e) {
    setStatus('err', t('errNet'));
    toast(t('errNet'));
  } finally {
    state.busy = false;
    $('#go').disabled = false;
  }
}

function recompute(soft) {
  if (!state.metrics) return;
  state.plan = buildGrid(state.metrics, state.capital, state.lev, state.countOverride);
  const p = state.plan;
  if (p && !p.error && p.levRaised && p.lev !== state.lev) {
    state.lev = p.lev;
    const el = $('#lev');
    if (el && document.activeElement !== el) el.value = p.lev;
  }
  if (soft) updateValues(); else render();
}

function bumpGrids(delta) {
  const base = state.plan && Number.isFinite(state.plan.count) ? state.plan.count : MIN_GRIDS;
  state.countOverride = clamp(base + delta, MIN_GRIDS, MAX_GRIDS);
  recompute();
}

/* ============================== install ============================== */
let installPrompt = null;
function isStandalone() {
  try {
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  } catch (e) { /* ignore */ }
  return window.navigator.standalone === true;
}
function showInstallBtn() {
  const b = $('#btnInstall');
  if (b && !isStandalone()) b.hidden = false;
}
function installHelp() {
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const steps = ios ? t('installIos') : t('installOther');
  $('#installSteps').innerHTML = (Array.isArray(steps) ? steps : []).map(s => '<li>' + s + '</li>').join('');
  $('#sheet').hidden = false;
}
function refreshNow() {
  const b = $('#btnRefresh');
  b.classList.add('spin');
  setTimeout(() => b.classList.remove('spin'), 800);
  if (state.mode === 'auto') runAuto(); else runManual();
}
function bindInstall() {
  const btn = $('#btnInstall');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installPrompt = e;
    showInstallBtn();
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    if (btn) btn.hidden = true;
    toast(t('ok'));
  });
  if (btn) {
    btn.addEventListener('click', async () => {
      if (installPrompt) {
        installPrompt.prompt();
        const c = await installPrompt.userChoice;
        installPrompt = null;
        if (c && c.outcome === 'accepted') btn.hidden = true;
        return;
      }
      installHelp();
    });
  }
  $('#installClose').addEventListener('click', () => { $('#sheet').hidden = true; });
  $('#btnDon').addEventListener('click', () => { $('#donSheet').hidden = false; });
  $('#donClose').addEventListener('click', () => { $('#donSheet').hidden = true; });
  $('#donSheet').addEventListener('click', e => { if (e.target.id === 'donSheet') $('#donSheet').hidden = true; });
  $('#donAddr').addEventListener('click', async () => {
    const ok = await copyText(DON_ADDR);
    toast(ok ? t('copied') : t('copyFail'));
  });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
  setTimeout(showInstallBtn, 1200);
}

/* ============================== bindings ============================== */
function applyLang() {
  document.documentElement.lang = lang;
  $('#langCode').textContent = lang.toUpperCase();
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#go').textContent = state.mode === 'auto' ? t('scan') : t('analyze');
  const rf = $('#btnRefresh');
  rf.title = t('refresh');
  rf.setAttribute('aria-label', t('refresh'));
  render();
}

function setMode(mode) {
  state.mode = mode;
  $$('.mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const input = $('#pair');
  input.readOnly = mode === 'auto';
  input.value = mode === 'auto' ? (state.metrics ? state.metrics.symbol : '—') : (state.metrics ? state.metrics.symbol : 'BTCUSDT');
  $('#go').textContent = mode === 'auto' ? t('scan') : t('analyze');
  if (mode === 'auto') runAuto();
}

function bind() {
  $('#btnLang').addEventListener('click', () => {
    const i = LANG_ORDER.indexOf(lang);
    lang = LANG_ORDER[(i + 1) % LANG_ORDER.length];
    try { localStorage.setItem('bv_lang', lang); } catch (err) { /* stockage bloque */ }
    applyLang();
    toast(t('langName'));
  });
  $$('.mode').forEach(b => b.addEventListener('click', () => {
    if (state.mode === b.dataset.mode) return;
    setMode(b.dataset.mode);
  }));
  $$('#tfSeg button').forEach(b => b.addEventListener('click', () => {
    $$('#tfSeg button').forEach(x => x.classList.toggle('active', x === b));
    state.tf = b.dataset.tf;
    if (state.mode === 'auto') runAuto(); else runManual();
  }));
  $('#go').addEventListener('click', () => {
    if (state.mode === 'auto') runAuto(); else runManual();
  });
  $('#pair').addEventListener('focus', e => { if (!e.target.readOnly) e.target.select(); });
  $('#pair').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); runManual(); } });
  $('#pair').addEventListener('blur', e => {
    if (state.mode === 'auto') return;
    const s = normalizePair(e.target.value);
    if (s) e.target.value = s;
  });
  const readNum = v => parseFloat(String(v).replace(',', '.'));
  $('#capital').addEventListener('input', e => {
    const v = readNum(e.target.value);
    if (!Number.isFinite(v) || v <= 0) return;
    state.capital = v;
    recompute(true);
  });
  $('#capital').addEventListener('change', e => {
    const v = readNum(e.target.value);
    state.capital = Number.isFinite(v) && v > 0 ? v : state.capital;
    e.target.value = state.capital;
    recompute();
  });
  $('#lev').addEventListener('input', e => {
    const v = parseInt(String(e.target.value).replace(/[^0-9]/g, ''), 10);
    if (!Number.isFinite(v) || v < 1) return;
    state.lev = clamp(v, 1, 10);
    recompute(true);
  });
  $('#lev').addEventListener('change', e => {
    state.lev = clamp(parseInt(e.target.value, 10) || 1, 1, 10);
    e.target.value = state.lev;
    recompute();
  });
  $('#cfg').addEventListener('click', async e => {
    const step = e.target.closest('[data-step]');
    if (step) { bumpGrids(parseInt(step.getAttribute('data-step'), 10) || 0); return; }
    if (e.target.closest('[data-auto]')) { state.countOverride = null; recompute(); return; }
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const val = btn.getAttribute('data-copy');
    if (!val) return;
    const ok = await copyText(val);
    if (!ok) { toast(t('copyFail')); return; }
    const cell = btn.closest('.cell') || btn;
    cell.classList.add('copied');
    const lab = btn.querySelector('.cpt');
    if (lab) lab.textContent = t('copied');
    setTimeout(() => {
      cell.classList.remove('copied');
      if (lab) lab.textContent = t('copy');
    }, 1100);
  });
  $('#cfg').addEventListener('input', e => {
    if (e.target.id !== 'grids') return;
    const digits = String(e.target.value).replace(/[^0-9]/g, '');
    if (!digits) return;
    state.countOverride = clamp(parseInt(digits, 10), MIN_GRIDS, MAX_GRIDS);
    recompute(true);
  });
  $('#cfg').addEventListener('change', e => {
    if (e.target.id !== 'grids') return;
    const digits = String(e.target.value).replace(/[^0-9]/g, '');
    if (!digits) { state.countOverride = null; recompute(); return; }
    state.countOverride = clamp(parseInt(digits, 10) || MIN_GRIDS, MIN_GRIDS, MAX_GRIDS);
    recompute(true);
    if (state.plan && !state.plan.error) state.countOverride = state.plan.count;
    render();
  });
  $('#btnRefresh').addEventListener('click', refreshNow);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('#sheet').hidden = true; $('#donSheet').hidden = true; }
  });
  bindInstall();
}

/* ============================== init ============================== */
function init() {
  try {
    const saved = localStorage.getItem('bv_lang');
    lang = (saved && I18N[saved]) ? saved : detectLang();
  } catch (e) { lang = detectLang(); }
  applyLang();
  render();
  bind();
  const q = new URLSearchParams(location.search).get('mode');
  if (q === 'auto') { setMode('auto'); return; }
  runManual();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => null); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
